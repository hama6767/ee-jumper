name: test
on: [push, pull_request]
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[dev,gui]'
      - run: ruff check src tests scripts launch
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0
      - run: xvfb-run -a python scripts/check_dashboard.py
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: python -m build
